<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NavOne · 스마트스토어 운영 자동화</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root {
  --green: #03C75A;
  --green-soft: #E6F9EE;
  --green-ink: #038443;
  --orange: #FF6F00;
  --orange-soft: #FFF1E0;
  --red: #E53935;
  --red-soft: #FDECEC;
  --ink: #1A1A1A;
  --ink-2: #666666;
  --ink-3: #999999;
  --line: #ECEEF1;
  --bg: #F7F8FA;
  --white: #FFFFFF;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ------- Layout ------- */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
}
.main {
  padding: 32px 40px 80px;
  max-width: 1400px;
  width: 100%;
}
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 28px;
  gap: 24px;
  flex-wrap: wrap;
}
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
.page-sub { color: var(--ink-2); font-size: 14px; margin: 0; }

/* ------- Sidebar ------- */
.sidebar {
  background: var(--white);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sb-logo {
  padding: 24px 22px 18px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.sb-logo .one { color: var(--green); }
.sb-nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.sb-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  width: 100%;
  transition: background 120ms, color 120ms;
}
.sb-item:hover { background: #F4F6F8; color: var(--ink); }
.sb-item.active { background: var(--green-soft); color: var(--green-ink); font-weight: 600; }
.sb-item .ico {
  width: 18px; height: 18px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.sb-item .badge-dot {
  margin-left: auto;
  width: 6px; height: 6px; border-radius: 50%; background: var(--orange);
}
.sb-foot {
  margin: 12px;
  padding: 14px;
  border-radius: 12px;
  background: #F7F8FA;
}
.sb-foot .store {
  font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px;
}
.sb-foot .store::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 0 3px rgba(3,199,90,.18);
}
.sb-foot .sub { font-size: 11.5px; color: var(--ink-2); margin-top: 8px; display: flex; justify-content: space-between; }
.sb-foot .sub b { color: var(--ink); font-weight: 600; }

/* ------- Card ------- */
.card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
}
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.card-title .hint { font-size: 12px; font-weight: 500; color: var(--ink-3); }

/* ------- Stat card ------- */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
}
.stat .label { color: var(--ink-2); font-size: 13px; font-weight: 500; }
.stat .val { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 10px; }
.stat .val .unit { font-size: 14px; color: var(--ink-2); font-weight: 500; margin-left: 4px; }
.stat .delta { font-size: 12px; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-weight: 600; }
.delta.up { color: var(--green-ink); background: var(--green-soft); }
.delta.down { color: var(--red); background: var(--red-soft); }
.delta.warn { color: var(--orange); background: var(--orange-soft); }
.stat .icon-pill {
  position: absolute; top: 16px; right: 16px;
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--green-soft); color: var(--green-ink);
}
.stat.alt .icon-pill { background: var(--orange-soft); color: var(--orange); }

/* ------- Generic ------- */
.row { display: flex; gap: 16px; }
.col { display: flex; flex-direction: column; gap: 16px; }
.grid-7-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

/* ------- Badge ------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}
.badge.green { background: var(--green-soft); color: var(--green-ink); }
.badge.orange { background: var(--orange-soft); color: var(--orange); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.gray { background: #F0F2F5; color: var(--ink-2); }

/* ------- Button ------- */
.btn {
  padding: 9px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid transparent;
  transition: all 120ms;
}
.btn.primary { background: var(--green); color: white; }
.btn.primary:hover { background: #02B852; }
.btn.ghost { background: white; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: #F4F6F8; }
.btn.danger { background: white; color: var(--red); border-color: #F5C6C6; }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { padding: 6px 12px; font-size: 12px; }

/* ------- Toggle ------- */
.toggle { width: 38px; height: 22px; background: #D8DCE2; border-radius: 999px; position: relative; transition: background 120ms; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: white; border-radius: 50%; transition: transform 160ms; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on { background: var(--green); }
.toggle.on::after { transform: translateX(16px); }

/* ------- Input ------- */
.input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  font-size: 13px;
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(3,199,90,.12); }
.input.pw { letter-spacing: 0.15em; }
textarea.input { resize: vertical; min-height: 80px; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field-hint { font-size: 11.5px; color: var(--ink-3); }

/* ------- Table ------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 12px 14px; text-align: left; }
.tbl th { font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line); background: #FAFBFC; }
.tbl tbody tr { border-bottom: 1px solid var(--line); }
.tbl tbody tr:last-child { border-bottom: none; }
.tbl tbody tr:hover { background: #FAFBFC; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.strike { text-decoration: line-through; color: var(--ink-3); }

/* ------- Chip / tag input ------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  background: #F0F2F5;
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink);
}
.chip button {
  width: 16px; height: 16px; border-radius: 50%;
  display: grid; place-items: center;
  background: #C9CED4; color: white; font-size: 11px; line-height: 1;
}
.chip button:hover { background: var(--ink-2); }
.chip.green { background: var(--green-soft); color: var(--green-ink); }
.chip.orange { background: var(--orange-soft); color: var(--orange); }

/* ------- Segmented ------- */
.seg { display: inline-flex; padding: 3px; background: #F0F2F5; border-radius: 10px; gap: 2px; }
.seg button { padding: 6px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button.active { background: white; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* ------- Activity feed item ------- */
.act { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: none; }
.act-ico { flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.act-ico.price { background: var(--green-soft); color: var(--green-ink); }
.act-ico.review { background: var(--orange-soft); color: var(--orange); }
.act-ico.talk { background: #EAF2FF; color: #2563EB; }
.act-title { font-size: 13.5px; font-weight: 600; }
.act-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.act-time { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

/* ------- Misc ------- */
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.kbd { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; background: #F0F2F5; padding: 2px 6px; border-radius: 4px; }
.empty { color: var(--ink-3); font-size: 13px; padding: 32px; text-align: center; }
.scroll-y { max-height: 420px; overflow-y: auto; }
.scroll-y::-webkit-scrollbar { width: 8px; }
.scroll-y::-webkit-scrollbar-thumb { background: #E0E3E8; border-radius: 4px; }

/* Chrome ext status */
.ext-status {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--green-soft);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--green-ink);
}
.ext-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(3,199,90,.2); }
.ext-status.off { background: #FDECEC; color: var(--red); }
.ext-status.off .dot { background: var(--red); box-shadow: 0 0 0 4px rgba(229,57,53,.18); }

/* Star rating */
.stars { display: inline-flex; gap: 1px; }
.stars svg { width: 14px; height: 14px; }
.review-bar { width: 4px; border-radius: 3px; }
.review-bar.s5 { background: var(--green); }
.review-bar.s34 { background: var(--orange); }
.review-bar.s12 { background: var(--red); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
/* global React */
const { useState, useEffect, useMemo, useRef } = React;

// ---------- Icons (stroke 1.6, 18px viewbox) ----------
const Icon = ({ name, size = 18, color = "currentColor" }) => {
  const props = {
    width: size, height: size, viewBox: "0 0 24 24",
    fill: "none", stroke: color, strokeWidth: 1.7,
    strokeLinecap: "round", strokeLinejoin: "round"
  };
  const paths = {
    home: <><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></>,
    tag: <><path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="7.5" r="1.2"/></>,
    chat: <><path d="M21 12c0 4.4-4 8-9 8-1.2 0-2.4-.2-3.4-.6L3 21l1.6-4.4C3.6 15.2 3 13.7 3 12c0-4.4 4-8 9-8s9 3.6 9 8Z"/></>,
    star: <><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6L12 17l-5.4 2.8 1-6L3.2 9.5l6.1-.9L12 3Z"/></>,
    sparkles: <><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.8 2.8M15.2 15.2 18 18M6 18l2.8-2.8M15.2 8.8 18 6"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></>,
    refresh: <><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></>,
    play: <><polygon points="6 4 20 12 6 20 6 4"/></>,
    pause: <><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></>,
    plus: <><path d="M12 5v14M5 12h14"/></>,
    x: <><path d="M6 6l12 12M18 6 6 18"/></>,
    check: <><path d="m5 12 5 5L20 6"/></>,
    bell: <><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8Z"/><path d="M10 21a2 2 0 0 0 4 0"/></>,
    arrowDown: <><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></>,
    arrowUp: <><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></>,
    send: <><path d="m22 2-7 20-4-9-9-4 20-7Z"/></>,
    chevR: <><path d="m9 6 6 6-6 6"/></>,
    chrome: <><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M21 12h-7.5"/><path d="M5.2 7.5 9 13.5"/><path d="M9 18.5 13.5 11"/></>,
    list: <><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></>,
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></>,
    trend: <><path d="M3 17 9 11l4 4 8-8"/><path d="M14 7h7v7"/></>,
    box: <><path d="m3.3 7 8.7 5 8.7-5"/><path d="M21 7v10l-9 5-9-5V7l9-5 9 5Z"/><path d="M12 12v10"/></>,
    clock: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
    flame: <><path d="M12 22c4.4 0 8-3.4 8-7.7 0-3.3-2-5.6-3.5-7-.5-.5-1.5-.3-1.5.5 0 1.5-1 2.7-2 2.7-1.4 0-1.5-1.8-1-4 .2-.8-.7-1.4-1.4-1C8.5 6.5 5 9.2 5 14.3 5 18.6 8 22 12 22Z"/></>,
  };
  return <svg {...props} aria-hidden="true">{paths[name] || null}</svg>;
};

// ---------- Toggle ----------
const Toggle = ({ on, onChange }) => (
  <button className={"toggle " + (on ? "on" : "")} onClick={() => onChange(!on)} aria-pressed={on} />
);

// ---------- Stars ----------
const Stars = ({ value = 0 }) => {
  const color = value >= 5 ? "var(--green)" : value >= 3 ? "var(--orange)" : "var(--red)";
  return (
    <span className="stars" aria-label={`${value}점`}>
      {[1,2,3,4,5].map(i => (
        <svg key={i} viewBox="0 0 24 24" fill={i <= value ? color : "#E0E3E8"}>
          <path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6L12 17l-5.4 2.8 1-6L3.2 9.5l6.1-.9L12 3Z"/>
        </svg>
      ))}
    </span>
  );
};

// ---------- Sparkline ----------
const Sparkline = ({ data, color = "var(--green)", height = 28, width = 84 }) => {
  const max = Math.max(...data, 1);
  const min = Math.min(...data, 0);
  const range = max - min || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v, i) => `${i * step},${height - ((v - min) / range) * height}`).join(" ");
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/>
    </svg>
  );
};

// ---------- StatCard ----------
const StatCard = ({ label, value, unit, delta, deltaTone = "up", icon, alt }) => (
  <div className={"stat" + (alt ? " alt" : "")}>
    <div className="label">{label}</div>
    <div className="val mono">{value}{unit && <span className="unit">{unit}</span>}</div>
    {delta && <div className={"delta " + deltaTone}>
      {deltaTone === "up" && <Icon name="arrowUp" size={11}/>}
      {deltaTone === "down" && <Icon name="arrowDown" size={11}/>}
      {delta}
    </div>}
    {icon && <div className="icon-pill"><Icon name={icon} size={18}/></div>}
  </div>
);

// ---------- PageHeader ----------
const PageHeader = ({ title, sub, right }) => (
  <div className="page-header">
    <div>
      <h1 className="page-title">{title}</h1>
      {sub && <p className="page-sub">{sub}</p>}
    </div>
    {right}
  </div>
);

Object.assign(window, { Icon, Toggle, Stars, Sparkline, StatCard, PageHeader });
</script>
<script type="text/babel">
/* global React, Icon */
const Sidebar = ({ current, onNav }) => {
  const items = [
    { id: "dashboard", label: "대시보드", icon: "home" },
    { id: "price", label: "가격 자동화", icon: "tag" },
    { id: "reviews", label: "리뷰 답글", icon: "star", dot: true },
    { id: "talktalk", label: "톡톡 AI 응답", icon: "chat", dot: true },
    { id: "optimize", label: "상품명 최적화", icon: "sparkles" },
    { id: "settings", label: "설정", icon: "settings" },
  ];
  return (
    <aside className="sidebar">
      <div className="sb-logo">Nav<span className="one">One</span></div>
      <nav className="sb-nav">
        {items.map(it => (
          <button
            key={it.id}
            className={"sb-item" + (current === it.id ? " active" : "")}
            onClick={() => onNav(it.id)}
          >
            <span className="ico"><Icon name={it.icon} size={17}/></span>
            <span>{it.label}</span>
            {it.dot && current !== it.id && <span className="badge-dot"/>}
          </button>
        ))}
      </nav>
      <div className="sb-foot">
        <div className="store">달콤한과일가게</div>
        <div className="sub">
          <span>플랜</span>
          <b>프로 · 23일 남음</b>
        </div>
      </div>
    </aside>
  );
};

window.Sidebar = Sidebar;
</script>

        <div className="col">
          <div className="card">
            <div className="card-title">
              네이버 Commerce API
              <span className="badge green">연결됨</span>
            </div>
            <div className="field">
              <label className="field-label">애플리케이션 ID</label>
              <input className="input mono" value={appId} onChange={e => setAppId(e.target.value)}/>
            </div>
            <div className="field" style={{marginTop: 12}}>
              <label className="field-label">시크릿</label>
              <div style={{display: "flex", gap: 8}}>
                <input
                  className={"input mono " + (secretVisible ? "" : "pw")}
                  type={secretVisible ? "text" : "password"}
                  value={secret}
                  onChange={e => setSecret(e.target.value)}
                />
                <button className="btn ghost sm" onClick={() => setSecretVisible(!secretVisible)}>
                  {secretVisible ? "숨김" : "표시"}
                </button>
              </div>
              <div className="field-hint">시크릿은 NavOne 서버에 암호화되어 저장됩니다.</div>
            </div>
          </div>

          <div className="card">
            <div className="card-title">스토어 정보</div>
            <div className="field">
              <label className="field-label">스토어명</label>
              <input className="input" value={storeName} onChange={e => setStoreName(e.target.value)}/>
            </div>
            <div className="field" style={{marginTop: 12}}>
              <label className="field-label">카테고리</label>
              <input className="input" value={category} onChange={e => setCategory(e.target.value)}/>
            </div>
          </div>

          <div className="card">
            <div className="card-title">
              상세페이지 정보
              <span className="hint">톡톡 AI 참고용</span>
            </div>
            <textarea
              className="input"
              rows="6"
              value={pageInfo}
              onChange={e => setPageInfo(e.target.value)}
              placeholder="스토어와 주요 상품에 대한 설명을 자세히 적어주세요. 톡톡 AI가 답변할 때 참고합니다."
            />
            <div className="field-hint" style={{marginTop: 8}}>
              현재 {pageInfo.length}자 입력됨 · 권장 200자 이상
            </div>
          </div>
        </div>

        <div className="col">
          <div className="card">
            <div className="card-title">
              텔레그램 알림
              <span className="badge green">활성</span>
            </div>
            <div className="field">
              <label className="field-label">봇 토큰</label>
              <input className="input mono pw" type="password" value={botToken} onChange={e => setBotToken(e.target.value)}/>
            </div>
            <div className="field" style={{marginTop: 12}}>
              <label className="field-label">Chat ID</label>
              <input className="input mono" value={chatId} onChange={e => setChatId(e.target.value)}/>
            </div>
            <div style={{display: "flex", gap: 8, marginTop: 14, alignItems: "center"}}>
              <button
                className="btn primary"
                onClick={() => {
                  setTelegramSent(true);
                  setTimeout(() => setTelegramSent(false), 2400);
                }}
              >
                <Icon name="send" size={12}/> 테스트 발송
              </button>
              {telegramSent && (
                <span className="badge green">
                  <Icon name="check" size={11}/> 전송 완료
                </span>
              )}
            </div>
            <div className="field-hint" style={{marginTop: 12}}>
              가격 변경 오류, 판매자 전달 건이 발생하면 즉시 알림을 받습니다.
            </div>
          </div>

          <div className="card">
            <div className="card-title">라이선스</div>
            <div className="field">
              <label className="field-label">라이선스 키</label>
              <input className="input mono" value={license} onChange={e => setLicense(e.target.value)}/>
            </div>
            <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 14}}>
              <div style={{padding: "12px 14px", background: "var(--green-soft)", borderRadius: 10}}>
                <div style={{fontSize: 11.5, color: "var(--green-ink)", fontWeight: 600}}>상태</div>
                <div style={{fontSize: 15, fontWeight: 700, color: "var(--green-ink)", marginTop: 4}}>활성</div>
              </div>
              <div style={{padding: "12px 14px", background: "#F7F8FA", borderRadius: 10}}>
                <div style={{fontSize: 11.5, color: "var(--ink-2)", fontWeight: 600}}>만료일</div>
                <div style={{fontSize: 15, fontWeight: 700, marginTop: 4}} className="mono">2026.06.12</div>
              </div>
            </div>
            <div className="field-hint" style={{marginTop: 12}}>
              현재 플랜: <b style={{color: "var(--ink)"}}>NavOne 프로</b> · 무제한 상품 · 모든 자동화 모듈 사용 가능
            </div>
            <div style={{display: "flex", gap: 8, marginTop: 14}}>
              <button className="btn ghost sm">결제 관리</button>
              <button className="btn primary sm">플랜 변경</button>
            </div>
          </div>

          <div className="card flat" style={{background: "#FAFBFC"}}>
            <div style={{fontSize: 12, color: "var(--ink-2)", fontWeight: 600, marginBottom: 6}}>NavOne 정보</div>
            <div className="field-hint" style={{lineHeight: 1.7}}>
              크롬 확장 버전 <span className="mono" style={{color: "var(--ink)"}}>v1.4.2</span> · 대시보드 <span className="mono" style={{color: "var(--ink)"}}>v0.9.7</span>
              <br/>
              문의: support@navone.kr · 가이드 문서 보기
            </div>
          </div>
        </div>
      </div>
    </>
  );
};

window.SettingsPage = SettingsPage;
</script>
<script type="text/babel">
/* global React, ReactDOM, Sidebar, DashboardPage, PricePage, ReviewsPage, TalkTalkPage, OptimizePage, SettingsPage */
const { useState } = React;

const App = () => {
  const [page, setPage] = useState("dashboard");

  const pages = {
    dashboard: <DashboardPage/>,
    price: <PricePage/>,
    reviews: <ReviewsPage/>,
    talktalk: <TalkTalkPage/>,
    optimize: <OptimizePage/>,
    settings: <SettingsPage/>,
  };

  const labels = {
    dashboard: "01 대시보드",
    price: "02 가격 자동화",
    reviews: "03 리뷰 답글",
    talktalk: "04 톡톡 AI 응답",
    optimize: "05 상품명 최적화",
    settings: "06 설정",
  };

  return (
    <div className="app">
      <Sidebar current={page} onNav={setPage}/>
      <main className="main" data-screen-label={labels[page]} key={page}>
        {pages[page]}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
